<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Peça por Peça</title>
    <link rel="stylesheet" href="./assets/style/reset.css">
    <link rel="stylesheet" href="./assets/style/style.css">
</head>
<body class="fundo-azul">

    <div class="container-cadastro">
        <div class="lado-esquerdo">
            <h1 class="titulo-bemvindo">
                <span class="letra-b">B</span><span class="letra-e">E</span><span class="letra-m">M</span>
                <span class="espaco-bemvindo"> </span> <span class="letra-v">V</span><span class="letra-i">I</span><span class="letra-n">N</span><span class="letra-d">D</span><span class="letra-o">O</span><span class="letra-exclamacao">!</span><span class="letra-exclamacao">!</span>
            </h1>
            <p class="subtitulo">Já possui uma conta?</p>
            <a href="entrar.html" class="botao-vazado">ENTRAR</a>
        </div>

        <div class="card-branco">
            <h2>CRIE SUA CONTA</h2>
            
            <div class="caixa-input">
                <span class="icone">👤</span>
                <input type="text" id="nome-cadastro" placeholder="Nome">
            </div>
            
            <div class="caixa-input">
                <span class="icone">✉️</span>
                <input type="email" id="email-cadastro" placeholder="Email">
            </div>

            <button id="btn-cadastrar" class="botao-verde">CADASTRAR</button>
    </div>
    <script type="module" src="cadastro.js"></script>
</body>
</html>
